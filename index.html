  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-xzktn2kr06WTkr8M+Xzodt7b7i8k+cR5CYwsTnSXwCk='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://zuzpyrwoovdavbuqrqpx.supabase.co http://localhost:8766; form-action 'self'; base-uri 'none'; object-src 'none'">

  <!-- The page's colour before the stylesheet loads, so it never flashes white. -->
  <style>html { background: #E7E7DD; } @media (prefers-color-scheme: dark) { html:not([data-theme="day"]) { background: #121311; } } html[data-theme="night"] { background: #121311; }</style>
  <!-- The day/night choice (js/theme.js), applied before anything draws. -->
  <script>try { var t = localStorage.getItem("f1nanc3.theme"); if (t === "day" || t === "night") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="style.css">
